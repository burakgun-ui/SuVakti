workflows:
  ios-workflow:
    name: iOS IPA Derleme
    instance_type: mac_mini_m2
    scripts:
      - name: Xcode Projesi Oluştur
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Uygulamayı Derle
        script: |
          set -e
          xcodebuild -project SuVakti.xcodeproj \
            -scheme SuVakti \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SuVakti.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SuVakti.ipa Payload
    artifacts:
      - SuVakti.ipa
