workflows:
  ios-workflow:
    name: iOS IPA Derleme
    instance_type: mac_mini_m2
    scripts:
      - name: Xcode Projesi Oluştur
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Uygulamayı Derle ve Paketle
        script: |
          set -e
          xcodebuild -project SuVakti.xcodeproj \
            -scheme SuVakti \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SuVakti.app Payload/
          /usr/bin/zip -r SuVakti.ipa Payload
    artifacts:
      - SuVakti.ipa
